{{ define "main" }}
<div class="page-header">
  <h1>Handouts</h1>
</div>
<br>
<section class="handouts-section">
  <h2>Olympiad Topics</h2>
  <div class="handouts-container">
    {{ range hugo.Data.handouts01 }}
      {{ range .links }}
      <div class="handouts-card">
        <h3>{{ .label }}</h3>
        <iframe src="{{ .pdf }}" width="100%" height="600px"></iframe>
        <div class="handouts-link">
          <a href="{{ .pdf | relURL }}" class="btn1">Open PDF</a>
          <a href="{{ .tex | relURL }}" class="btn1">TeX (Git)</a>
        </div>
      </div>
      {{ end }}
    {{ end }}
  </div>
</section>
<br>
{{ end }}
