{{ define "main" }}
<div class="page-header">
  <h1>Classes</h1>
</div>
<br>
<section class="classes-section">
  <div class="classes-container">
    {{ range .RegularPages }}
    <div class="classes-preview">
      <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}">

      <div class="classes-preview-content">
        <a href="{{ .Permalink }}"
           class="classes-preview-title">{{ .Title }}</a>

        <div class="classes-preview-meta">
          Status: {{ .Params.Status }}
          <br>
          Last Updated: {{ .Date.Format "January 2, 2006" }}
        </div>
        <hr>

        <p class="classes-preview-description">{{ .Description }}</p>

        <a href="{{ .Permalink }}" class="btn1">Read more</a>
      </div>
    </div>
    {{ end }}
  </div>
</section>
<br>
{{ end }}
