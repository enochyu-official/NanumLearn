{{ define "main" }}
<div class="page-header">
  <h1>News</h1>
</div>
<br>
<section id="news-section">
  <div id="news-container">
    {{ range hugo.Data.news }}
      <div id="news-item">
        <span>
          {{- range .links -}}
          {{ if .url }}
            <a href="{{ .url | relURL }}" class="news-title"
               target="_blank" rel="noopener noreferrer">{{ .label }}
            </a>
          {{ else }}
            <span class="news-title">{{ .label }}</span>
          {{ end }}
          {{- end -}}
        </span>
        <span class="news-date">{{ .date }}</span>
      </div>
    {{ end }}
  </div>
</section>
<br>
{{ end }}
