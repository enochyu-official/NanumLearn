{{ define "main" }}
<div class="page-header">
  <h1>News</h1>
</div>
<br>
<section id="news-section">
  <div id="news-container">
    {{ range .RegularPages }}
      <div id="news-item">
        <a href="{{ .Permalink }}" class="news-title">{{ .Title }}</a>
        <span class="news-date">{{ .Date.Format "January 2, 2006" }}</span>
      </div>
    {{ end }}
  </div>
</section>
<br>
{{ end }}
